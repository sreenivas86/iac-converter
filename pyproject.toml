[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iac-converter"
version = "0.1.0"
description = "Bidirectional YAML and Terraform infrastructure converter"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "PyYAML>=6.0",
    "python-hcl2>=4.3",
    "fastapi>= 0.149.0",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-PyYAML>=6.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint.per-file-ignores]
"src/iac_converter/api/app.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
iac-converter = "iac_converter.cli:main"